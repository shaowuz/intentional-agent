[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "intentional-agent"
version = "0.2.0"
description = "A local research environment for repeated games with private agent objectives"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<0.29",
  "pydantic>=2.9,<3",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1.0,<2",
  "tiktoken>=0.9,<1",
  "PyYAML>=6.0",
  "numpy>=1.21",
  "pandas>=1.3",
  "matplotlib>=3.4",
  "requests>=2.25",
]

[project.scripts]
intentional-experiments = "swarm_game.cli:main"
swarm-game = "swarm_game.cli:main"
ipd = "ipd.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
swarm_game = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: integration tests that require a working Docker daemon"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "backend/**/*.py" }, { file = "backend/**/*.txt" }]
