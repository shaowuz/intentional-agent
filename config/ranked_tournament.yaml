# Real-LLM configuration for the 4-agent ranked tournament.
#
# Provider: OpenRouter (OpenAI-compatible endpoint).  The API key is read from
# the environment variable named by `api_key_env`; it is never stored here.
#
# Run:
#   export OPENAI_API_KEY=...        # or change api_key_env below
#   python3 -m ranked_tournament.cli run --config config/ranked_tournament.yaml
#   python3 -m ranked_tournament.cli analyze --results results/ranked_tournament
name: ranked_tournament
seed: 20240501
output_dir: results/ranked_tournament
n_rounds: 15
agents: [A, B, C, D]
continue_prob: 0.95
max_stages: 500
ranking_points: [3, 2, 1, 0]
max_decision_retries: 3
max_reflection_retries: 3

llm:
  provider: openai
  model: openai/gpt-4o-mini
  temperature: 0.7
  top_p: 1.0
  max_tokens: 1200
  seed: null
  api_key_env: OPENAI_API_KEY
  base_url: https://openrouter.ai/api/v1
  timeout: 90
  max_retries: 4
  pricing:
    # USD per 1k tokens; OpenAI gpt-4o-mini list prices.
    input_per_1k_tokens: 0.00015
    output_per_1k_tokens: 0.0006
