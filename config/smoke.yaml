# Small end-to-end smoke configuration (mock backend, very short games).
# Purpose: verify the whole pipeline runs and records data.
name: smoke
seed: 12345
output_dir: results/smoke
conditions: [fixed, random]
games_per_agent: 2
fixed_rounds: 6
continue_prob: 0.95
max_rounds_random: 40
pairing_strategy: round_robin

population:
  priors: [0.1, 0.5, 0.9]
  agents_per_prior: 2

llm:
  provider: mock          # switch to "openai" or "anthropic" for a real model
  model: mock-strategic
  temperature: 0.7
  top_p: 1.0
  max_tokens: 300
  seed: null
  api_key_env: OPENAI_API_KEY
  base_url: null
  timeout: 60
  max_retries: 4
  pricing:
    input_per_1k_tokens: 0.0
    output_per_1k_tokens: 0.0

memory:
  # 0 = render everything (lossless prompt view)
  recent_rounds_in_prompt: 0
  max_completed_game_lines: 0
